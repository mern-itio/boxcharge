# BoxCharge — Nginx site config
# Copy to server: /etc/nginx/sites-available/boxcharge
# Then: sudo ln -s /etc/nginx/sites-available/boxcharge /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name boxchrge.com www.boxchrge.com;

    # Redirect HTTP → HTTPS (uncomment after certbot SSL is installed)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

